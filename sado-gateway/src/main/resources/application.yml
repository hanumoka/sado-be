spring:
  application:
    name: sado-gateway

  # MySQL 데이터소스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/sado_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sado_user
    password: sado1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate  # 개발: update, 운영: validate
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.MySQL8Dialect # springboot 3버전에서는 자동감지
        format_sql: true
        show_sql: true
    open-in-view: false

  # Kafka 설정 (기본)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sado-gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 서버 설정
server:
  port: 8080

# 로깅 설정
logging:
  level:
    com.hanumoka.sado: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
