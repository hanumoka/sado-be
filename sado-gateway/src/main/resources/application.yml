spring:
  application:
    name: sado-gateway

  # MySQL 데이터소스 설정
  datasource:
    url: jdbc:mysql://localhost:10100/sado_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sado_user
    password: sado1234
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 커넥션 풀 설정
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate  # 개발: update, 운영: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
    open-in-view: false

  # Kafka 설정 (기본)
  kafka:
    bootstrap-servers: localhost:10102
    consumer:
      group-id: sado-gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 서버 설정
server:
  port: 10200

# 로깅 설정
logging:
  level:
    com.hanumoka.sado: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Swagger/OpenAPI 설정
springdoc:
  api-title: SADO Gateway API
  api-description: Gateway 서비스 REST API
  api-version: 0.0.1-SNAPSHOT
  api-contact-name: SADO Gateway Team
  api-contact-email: gateway@hanumoka.com

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

  api-docs:
    path: /api-docs
    enabled: true

  packages-to-scan: com.hanumoka.sado.controller
  paths-to-match: /api/**
