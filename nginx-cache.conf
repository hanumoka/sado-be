# =============================================================================
# SADO MiniPACS - Nginx Caching Proxy Configuration
# =============================================================================
# 용도: DICOMweb API 응답 캐싱으로 Backend 부하 감소
# 포트: 10202 (Docker) -> 80 (내부)
# =============================================================================

# 캐시 영역 정의 (10GB, 1일 미사용 시 삭제)
proxy_cache_path /tmp/nginx/cache levels=1:2 keys_zone=dicom_cache:100m
                 max_size=10g inactive=1d use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # 로깅
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 캐시 상태 헤더 (디버깅용)
    add_header X-Cache-Status $upstream_cache_status;

    # ==========================================================================
    # STOW-RS Upload - 캐싱 없이 프록시 (POST /dicomweb/studies)
    # ==========================================================================
    # CRITICAL: 반드시 regex location (~ ^/dicomweb/studies) 보다 먼저 매칭되어야 함
    # Nginx 우선순위: exact match (=) > regex (~)
    # 이 location은 GET /dicomweb/studies (Study 목록 조회)도 처리함
    # ==========================================================================
    location = /dicomweb/studies {
        # 대용량 파일 업로드 지원 (Spring Boot 설정과 동일: 500MB)
        client_max_body_size 500M;

        # 요청 버퍼링 비활성화 (스트리밍 업로드로 메모리 절약)
        proxy_request_buffering off;

        # 업로드 타임아웃 설정 (대용량 파일 업로드 고려)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 캐싱 비활성화 (POST 요청에 캐싱은 부적절)
        proxy_cache off;

        proxy_pass http://host.docker.internal:10201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
    }

    # ==========================================================================
    # WADO-RS Rendered - 캐싱 대상 (불변 데이터)
    # ==========================================================================
    location ~ ^/dicomweb/studies/.*/series/.*/instances/.*/rendered {
        proxy_pass http://host.docker.internal:10201;
        proxy_cache dicom_cache;
        proxy_cache_valid 200 7d;           # 200 OK: 7일 캐시
        proxy_cache_valid 404 1m;           # 404: 1분 (재시도 가능)
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale error timeout updating;

        # 캐시 저장 조건
        proxy_cache_min_uses 1;
        proxy_ignore_headers Cache-Control Expires;

        # 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================================================
    # WADO-RS Frames - 캐싱 대상 (불변 데이터)
    # ==========================================================================
    location ~ ^/dicomweb/studies/.*/series/.*/instances/.*/frames {
        proxy_pass http://host.docker.internal:10201;
        proxy_cache dicom_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale error timeout updating;

        proxy_cache_min_uses 1;
        proxy_ignore_headers Cache-Control Expires;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================================================
    # Thumbnail - 캐싱 대상
    # ==========================================================================
    location ~ ^/dicomweb/studies/.*/series/.*/instances/.*/thumbnail {
        proxy_pass http://host.docker.internal:10201;
        proxy_cache dicom_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale error timeout updating;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================================================
    # MJPEG Streaming - 캐싱 대상 (Cine 재생)
    # ==========================================================================
    location ~ ^/dicomweb/studies/.*/series/.*/instances/.*/mjpeg {
        proxy_pass http://host.docker.internal:10201;
        proxy_cache dicom_cache;
        proxy_cache_valid 200 1h;           # 스트리밍: 1시간 캐시
        proxy_cache_key "$request_uri$args";

        # 스트리밍 설정
        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================================================
    # QIDO-RS Metadata - 짧은 캐시 (목록 데이터는 변경 가능)
    # ==========================================================================
    location ~ ^/dicomweb/studies {
        proxy_pass http://host.docker.internal:10201;
        proxy_cache dicom_cache;
        proxy_cache_valid 200 5m;           # 5분 캐시 (메타데이터 변경 가능)
        proxy_cache_key "$request_uri$args";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================================================
    # 기타 API - 캐싱 없이 프록시
    # ==========================================================================
    location /api {
        proxy_pass http://host.docker.internal:10201;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /dicomweb {
        proxy_pass http://host.docker.internal:10201;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
