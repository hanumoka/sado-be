# DCM4CHE ImageReaderFactory Configuration
# ==========================================
# DICOM Transfer Syntax별 ImageReader 매핑
# 형식: TransferSyntaxUID:codecName:readerClass:patchJPEGLS:YBR2RGB
#
# 문제: OpenCV 4.9.0-dcm JPEG 디코더가 특정 DICOM JPEG Baseline 파일을
#       디코딩하지 못하여 빈 이미지(0x0)를 반환함
# 해결: JPEG Baseline/Extended는 JDK 내장 코덱 사용, 나머지는 OpenCV 사용

# ========== JPEG Baseline/Extended - JDK 내장 코덱 사용 ==========
# JDK 내장 JPEG 코덱이 더 안정적이고 대부분의 DICOM JPEG 파일과 호환됨

# JPEG Baseline (Process 1) - 1.2.840.10008.1.2.4.50
1.2.840.10008.1.2.4.50:jpeg:*:

# JPEG Extended (Process 2 & 4) - 1.2.840.10008.1.2.4.51
1.2.840.10008.1.2.4.51:jpeg:*:

# ========== JPEG Lossless - OpenCV 사용 (JDK 미지원) ==========
# JPEG Lossless, Non-Hierarchical (Process 14) - 1.2.840.10008.1.2.4.57
1.2.840.10008.1.2.4.57:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::

# JPEG Lossless, Non-Hierarchical, First-Order Prediction (Process 14, SV1) - 1.2.840.10008.1.2.4.70
1.2.840.10008.1.2.4.70:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::

# ========== JPEG-LS - OpenCV 사용 ==========
# JPEG-LS Lossless - 1.2.840.10008.1.2.4.80
1.2.840.10008.1.2.4.80:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::

# JPEG-LS Lossy (Near-Lossless) - 1.2.840.10008.1.2.4.81
1.2.840.10008.1.2.4.81:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::

# ========== JPEG 2000 - OpenCV 사용 ==========
# JPEG 2000 Image Compression (Lossless Only) - 1.2.840.10008.1.2.4.90
1.2.840.10008.1.2.4.90:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::

# JPEG 2000 Image Compression - 1.2.840.10008.1.2.4.91
1.2.840.10008.1.2.4.91:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::

# ========== RLE - OpenCV 사용 ==========
# RLE Lossless - 1.2.840.10008.1.2.5
1.2.840.10008.1.2.5:jpeg-cv:org.dcm4che3.opencv.NativeImageReader::
