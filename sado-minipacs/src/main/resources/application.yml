spring:
  application:
    name: sado-minipacs

  # 데이터소스 설정 (MySQL)
  datasource:
    url: jdbc:mysql://localhost:10100/sado_minipacs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 커넥션 풀 설정
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: create  # 개발: update, 운영: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
        # JPA Auditing 활성화 (@CreatedDate, @LastModifiedDate)
        enable_lazy_load_no_trans: false

# 서버 설정
server:
  port: 10201

# 로깅 설정
logging:
  level:
    root: INFO
    com.hanumoka.sado: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.tool.schema: DEBUG
    org.hibernate.boot: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger/OpenAPI 설정
springdoc:
  api-title: SADO MiniPACS API
  api-description: MiniPACS 서비스 REST API - DICOM 이미지 관리 시스템
  api-version: 0.0.1-SNAPSHOT
  api-contact-name: SADO MiniPACS Team
  api-contact-email: minipacs@hanumoka.com

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

  api-docs:
    path: /api-docs
    enabled: true

  packages-to-scan: com.hanumoka.sado.minipacs.controller
  paths-to-match: /api/**
