spring:
  application:
    name: sado-minipacs
  output:
    ansi:
      enabled: ALWAYS
  # Virtual Thread (Java 21 Project Loom) 설정
  # - I/O-bound 작업(DB, S3, HTTP)에서 처리량 20-50% 향상 기대
  # - Platform Thread 대비 메모리 효율 ~100배 (1MB → ~10KB/thread)
  # - ThreadLocal은 Virtual Thread에서도 정상 동작 (TenantContext 호환)
  threads:
    virtual:
      enabled: true

  # 파일 업로드 설정 (DICOM 파일 업로드)
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB      # 단일 파일 최대 크기
      max-request-size: 500MB   # 전체 요청 최대 크기 (다중 파일 포함)
      file-size-threshold: 2MB  # 메모리 임계값 (초과 시 임시 파일 생성)

  # 데이터소스 설정 (MySQL)
  datasource:
    url: jdbc:mysql://localhost:10100/sado_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 커넥션 풀 설정
    # 최적화 기준: AMD Ryzen 7 8845HS (16스레드), 32GB RAM
    # 공식: connections = (core_count × 2) + spindle_count = (16 × 2) + 1 = 33
    # 실제 적용: 로컬 개발환경 고려하여 20으로 설정 (MySQL, SeaweedFS 등 공유)
    hikari:
      pool-name: sado-minipacs-pool
      maximum-pool-size: 20           # 10 → 20 (Virtual Thread 병목 해소)
      minimum-idle: 10                # 5 → 10 (빠른 응답을 위해 유휴 커넥션 확보)
      connection-timeout: 30000       # 30초 (유지)
      idle-timeout: 300000            # 5분 (600000 → 300000, 리소스 절약)
      max-lifetime: 1800000           # 30분 (유지)
      leak-detection-threshold: 60000 # 커넥션 누수 감지 (60초)

  # JPA 설정
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update  # 개발: update, 운영: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
        # JPA Auditing 활성화 (@CreatedDate, @LastModifiedDate)
        enable_lazy_load_no_trans: false

# 서버 설정
server:
  port: 10201
  # HTTP Gzip 압축 설정 (2026-01-12 추가)
  # - 대역폭 70% 절감 효과
  # - DICOM 이미지 전송 최적화
  compression:
    enabled: true
    min-response-size: 1024    # 1KB 이상만 압축 (작은 응답은 오버헤드)
    mime-types:
      - application/octet-stream   # BulkData (Raw PixelData)
      - image/png                  # Rendered PNG
      - image/jpeg                 # Thumbnail JPEG
      - multipart/related          # 배치 프레임 응답
      - application/json           # API 응답
      - application/dicom+json     # DICOM 메타데이터
  # Tomcat 설정 (Virtual Thread 환경 최적화)
  tomcat:
    # Virtual Thread 사용 시 스레드 수보다 커넥션 수가 중요
    max-connections: 2000           # 8192 → 2000 (로컬 개발환경 적정 수준)
    accept-count: 200               # 100 → 200 (연결 대기 큐 확장)
    connection-timeout: 20000       # 20초 (커넥션 타임아웃)
    # Virtual Thread 환경에서는 스레드 풀 설정이 덜 중요하지만 명시적 설정
    threads:
      max: 200                      # 기본값 유지 (Virtual Thread가 실제 처리)
      min-spare: 10                 # 기본값 유지

# 로깅 설정 (상세 설정은 logback-spring.xml 참조)
logging:
  level:
    root: INFO
    com.hanumoka.sado: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
  # 색상 있는 로그 패턴은 logback-spring.xml에서 설정

# Swagger/OpenAPI 설정
springdoc:
  api-title: SADO MiniPACS API
  api-description: MiniPACS 서비스 REST API - DICOM 이미지 관리 시스템
  api-version: 0.0.1-SNAPSHOT
  api-contact-name: SADO MiniPACS Team
  api-contact-email: minipacs@hanumoka.com

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

  api-docs:
    path: /api-docs
    enabled: true

  packages-to-scan: com.hanumoka.sado.minipacs.controller
  paths-to-match: /api/**

# SeaweedFS S3 API 설정
seaweedfs:
  s3:
    endpoint: http://localhost:10405   # filer S3 API 포트
    region: us-east-1                  # AWS SDK 필수파라미터(SeaweedFS는 무시)
    access-key: ${SEAWEEDFS_ACCESS_KEY:any}    # 기본값: any (로컬 개발용)
    secret-key: ${SEAWEEDFS_SECRET_KEY:any}    # 기본값: any (로컬 개발용)
    bucket: minipacs                   # DICOM 파일 저장 버킷명
    path-style-access: true            # SeaweedFS 필수 (true), 버킷을 path에 포함 하는 설정
    # 타임아웃/재시도 설정 (2026-01-05 추가)
    api-call-timeout: 300000           # 전체 API 호출 타임아웃 (5분) - 대용량 파일용
    api-call-attempt-timeout: 60000    # 개별 시도 타임아웃 (60초)
    max-retries: 3                     # 최대 재시도 횟수 (503, 429, 네트워크 오류)

  # SeaweedFS Admin API 설정 (클러스터 관리)
  # ============================================================================
  # 단일 노드 설정 (현재 사용 중, 하위 호환성 유지)
  # ============================================================================
  admin:
    master-url: http://localhost:10400   # Master 서버 (메타데이터 관리, Cluster 상태)
    volume-url: http://localhost:10402   # Volume 서버 (실제 파일 저장)
    filer-url: http://localhost:10403    # Filer 서버 (파일 시스템 인터페이스)
    connection-timeout: 5000             # 연결 타임아웃 (5초)
    read-timeout: 30000                  # 읽기 타임아웃 (30초)

    # ============================================================================
    # 다중 노드 설정 (권장, 프로덕션 환경)
    # 아래 설정을 활성화하면 단일 노드 설정(master-url, volume-url, filer-url)보다 우선 적용됩니다.
    # ============================================================================
    # masters:
    #   - name: master-1
    #     url: http://seaweed-master-1:9333
    #     enabled: true
    #   - name: master-2
    #     url: http://seaweed-master-2:9333
    #     enabled: true
    #   - name: master-3
    #     url: http://seaweed-master-3:9333
    #     enabled: true
    # volume-servers:
    #   - name: volume-1
    #     url: http://seaweed-volume-1:8080
    #     enabled: true
    #   - name: volume-2
    #     url: http://seaweed-volume-2:8080
    #     enabled: true
    # filers:
    #   - name: filer-1
    #     url: http://seaweed-filer-1:8888
    #     enabled: true
    #   - name: filer-2
    #     url: http://seaweed-filer-2:8888
    #     enabled: true

# Storage 접근 전략 설정 (Week 4-5 추가)
storage:
  # 파일 접근 방식 선택
  # - presigned-url: Frontend가 SeaweedFS에 직접 접근 (POC 기본값)
  # - backend-proxy: Frontend가 Backend Proxy 경유 (Week 9+ 프로덕션)
  access-strategy: presigned-url

  # POC (Week 4-8): Pre-signed URL 방식
  #   장점: Backend 부하 최소화, 성능 우수, AWS S3 표준 패턴 학습
  #   단점: URL 유출 위험, 감사 추적 불가, HIPAA/GDPR 미충족
  #
  # 프로덕션 (Week 9+ KingArthur 통합): Backend Proxy 방식
  #   장점: 완벽한 테넌트 격리, 감사 추적, HIPAA/GDPR 준수, DLP 적용
  #   단점: Backend 부하 증가, 성능 30% 느림
  #
  # 전환 방법: 설정만 변경 (코드 변경 0줄)
  #   storage.access-strategy: backend-proxy

# Admin & Tiering 설정
# ============================================================================
# [POC 상태] 현재 Tiering은 DB 메타데이터(storageTier 필드)만 업데이트합니다.
# - 물리적 파일 이동 없음: SeaweedFS 볼륨이 1개여도 문제없음
# - 실제 SSD → HDD → Archive 이동은 미구현
# - 향후 Multi-Volume Server 구성 시 물리적 이동 로직 추가 필요
# ============================================================================
admin:
  tiering:
    # HOT → WARM 전환 기준 (일 단위)
    hot-to-warm-days: 30
    # WARM → COLD 전환 기준 (일 단위)
    warm-to-cold-days: 365
    # 자동 Tiering 스케줄러 활성화 여부 (현재 비활성화 - DB 라벨링만 수행)
    scheduler-enabled: false
    # HOT → WARM 스케줄 (Cron 표현식: 매일 새벽 3시)
    hot-to-warm-schedule: "0 0 3 * * *"
    # WARM → COLD 스케줄 (Cron 표현식: 매일 새벽 4시)
    warm-to-cold-schedule: "0 0 4 * * *"

# MiniPACS 설정
minipacs:
  # 기본 User ID (Week 12+ 전까지 임시)
  # Week 12+ Spring Security 도입 후 SecurityContext에서 추출
  default-user-id: 1

# 업로드 동시성 제한 설정 (2026-01-05 추가, 2026-01-08 최적화)
upload:
  # 최대 동시 업로드 수 (Semaphore permits)
  # 최적화 기준: 32GB RAM, DB 풀 20개
  # - DB 풀(20)의 절반으로 설정하여 다른 요청용 여유 확보
  # - 메모리 고려: 500MB × 10 = 5GB 최대 동시 처리 (32GB 중 약 16%)
  max-concurrent: 10              # 5 → 10 (DB 풀 확장에 맞춰 증가)
  # permit 획득 대기 시간 (밀리초)
  # - 초과 시 429 Too Many Requests 반환
  acquire-timeout-ms: 30000
  # 클라이언트에게 전달할 재시도 대기 시간 (초)
  # - Retry-After 헤더 값
  retry-after-seconds: 30

# 비동기 처리 설정 (사전 렌더링, S3 업로드)
async:
  # 사전 렌더링 스레드 풀
  # - CPU 집약적 작업 (이미지 렌더링)
  # - 낮은 값으로 설정하여 시스템 부하 조절
  pre-rendering:
    core-pool-size: 4
    max-pool-size: 4
    queue-capacity: 500
  # S3 업로드 스레드 풀
  # - I/O 바운드 작업 (네트워크 대기)
  # - 프레임당 최대 8개 업로드 (raw, compressed, jpeg, png, 4 cine jpeg)
  s3-upload:
    core-pool-size: 4
    max-pool-size: 4
    queue-capacity: 500

# 사전 렌더링 대상 설정
# 각 렌더링 타입을 개별적으로 on/off 할 수 있습니다.
# 저장 공간 최적화 또는 특정 포맷만 필요한 경우 사용합니다.
pre-rendering:
  # 전체 사전 렌더링 활성화/비활성화
  enabled: true
  targets:
    # 썸네일 (128x128 JPEG, 첫 프레임) - 목록 표시용
    thumbnail:
      enabled: true
      size: 128
    # Raw PixelData (.raw) - Cornerstone3D wadors 로더용
    # 비활성화: 용량 절약 (원본의 10배 이상 증가 방지)
    bulkdata:
      enabled: false
    # 원본 압축 데이터 (압축 DICOM인 경우만) - 대역폭 절감용
    compressed:
      enabled: true
    # JPEG Baseline (원본 해상도) - 범용 호환성, 빠른 전송
    jpeg:
      enabled: true
      quality: 90    # 1-100, 권장: 90
    # PNG 렌더링 (512px, W/L 적용) - WADO-RS Rendered API용
    # 비활성화: cine-256으로 대체하여 용량 54% 절감 (PNG ~200KB/frame → JPEG ~20KB/frame)
    rendered:
      enabled: false
    # Cine JPEG (256/128/64/32px) - 빠른 Cine 재생용
    # WADO-RS Rendered API도 cine-256을 사용 (rendered 비활성화 시)
    cine:
      enabled: true
      quality: 80    # 1-100, 권장: 80
      size256: true  # 256px 생성 여부 (WADO-RS Rendered 대체용)
      size128: true  # 128px 생성 여부
      size64: false  # 64px 생성 여부 - 비활성화: 사용 빈도 낮음
      size32: false  # 32px 생성 여부 - 비활성화: 사용 빈도 낮음

