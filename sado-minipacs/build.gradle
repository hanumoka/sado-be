plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = "com.hanumoka.sado"
version = "0.0.1-SNAPSHOT"

repositories {
    mavenCentral()
    // DCM4CHE 공식 저장소
    maven { url 'https://www.dcm4che.org/maven2' }
    // Weasis OpenCV 네이티브 라이브러리 저장소
    maven { url 'https://raw.github.com/nroduit/mvn-repo/master' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Java 컴파일러에 -parameters 플래그 추가
// → Spring이 @PathVariable, @RequestParam 등의 파라미터 이름을 런타임에 인식 가능
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}

dependencies {
    // sado-common 의존성 (BaseEntity, TenantAwareEntity 사용)
    implementation project(':sado-common')

    // Spring Boot & JPA
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.data.jpa

    // Spring Validation (입력 검증)
    implementation libs.spring.boot.starter.validation

    // Database
    runtimeOnly libs.mysql.connector.java

    // AWS SDK S3 (SeaweedFS 연동)
    implementation libs.aws.s3

    // Spring Retry (Optimistic Lock 충돌 시 자동 재시도)
    implementation libs.spring.retry
    implementation libs.aspectj.weaver  // AOP 지원

    // Spring Cache + Caffeine (로컬 캐시)
    implementation libs.spring.boot.starter.cache
    implementation libs.caffeine

    // UUID v7
    implementation 'com.github.f4b6a3:uuid-creator:5.3.7'

    // DCM4CHE DICOM 라이브러리 (5.29.1 - mini-pacs-poc 검증 버전)
    implementation 'org.dcm4che:dcm4che-core:5.29.1'
    implementation 'org.dcm4che:dcm4che-imageio:5.29.1'   // DICOM 이미지 렌더링
    implementation 'org.dcm4che:dcm4che-image:5.29.1'     // 픽셀 데이터 처리
    implementation 'org.dcm4che:dcm4che-imageio-opencv:5.29.1'  // JPEG/JPEG2000 코덱 (OpenCV 기반)

    // Weasis OpenCV Java 바인딩 (JPEG 디코딩에 필요)
    runtimeOnly 'org.weasis.thirdparty.org.opencv:opencv:4.9.0-dcm'

    // 플랫폼별 OpenCV 네이티브 라이브러리
    // Windows 64-bit
    runtimeOnly('org.weasis.thirdparty.org.opencv:opencv_java:4.9.0-dcm:windows-x86-64@dll')
    // Linux 64-bit
    runtimeOnly('org.weasis.thirdparty.org.opencv:libopencv_java:4.9.0-dcm:linux-x86-64@so')
    // macOS x86-64
    runtimeOnly('org.weasis.thirdparty.org.opencv:libopencv_java:4.9.0-dcm:macosx-x86-64@dylib')
    // macOS ARM (Apple Silicon)
    runtimeOnly('org.weasis.thirdparty.org.opencv:libopencv_java:4.9.0-dcm:macosx-aarch64@dylib')

    // Lombok (Annotation Processor 명시적 등록)
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Test
    testImplementation libs.spring.boot.starter.test
    testImplementation 'org.mockito:mockito-core:5.8.0'  // Mockito for @MockBean
    testRuntimeOnly libs.h2.database  // H2 in-memory database for testing
    testRuntimeOnly libs.junit.platform.launcher  // JUnit Platform launcher
}

// ========== OpenCV 네이티브 라이브러리 설정 ==========
// DCM4CHE ImageIO OpenCV가 System.loadLibrary("opencv_java")를 호출하므로
// 라이브러리 파일명을 opencv_java.dll/libopencv_java.so로 맞춰줘야 함

def nativesDir = layout.buildDirectory.dir("natives")

tasks.register('copyOpenCVNatives') {
    description = 'Copies OpenCV native library with correct filename for System.loadLibrary'
    group = 'build'

    doLast {
        def osName = System.getProperty('os.name').toLowerCase()
        def osArch = System.getProperty('os.arch').toLowerCase()

        def targetFileName
        def sourceFile

        if (osName.contains('win')) {
            targetFileName = 'opencv_java.dll'
            sourceFile = configurations.runtimeClasspath.find {
                it.name.contains('opencv_java') && it.name.endsWith('.dll')
            }
        } else if (osName.contains('linux')) {
            targetFileName = 'libopencv_java.so'
            sourceFile = configurations.runtimeClasspath.find {
                it.name.contains('libopencv_java') && it.name.endsWith('.so')
            }
        } else if (osName.contains('mac')) {
            targetFileName = 'libopencv_java.dylib'
            sourceFile = configurations.runtimeClasspath.find {
                it.name.contains('libopencv_java') && it.name.endsWith('.dylib')
            }
        }

        if (sourceFile != null) {
            def targetDir = nativesDir.get().asFile
            targetDir.mkdirs()
            def targetFile = new File(targetDir, targetFileName)

            logger.lifecycle("Copying OpenCV native library:")
            logger.lifecycle("  Source: ${sourceFile}")
            logger.lifecycle("  Target: ${targetFile}")

            targetFile.bytes = sourceFile.bytes
        } else {
            logger.warn("OpenCV native library not found for platform: ${osName} ${osArch}")
        }
    }
}

// bootRun 태스크에 네이티브 라이브러리 경로 설정
tasks.named('bootRun') {
    dependsOn 'copyOpenCVNatives'
    systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath

    // JVM 메모리 설정 (32GB RAM 노트북 최적화)
    // - 초기 힙: 2GB (빠른 시작)
    // - 최대 힙: 8GB (대용량 DICOM 처리, 동시 업로드 고려)
    // - G1GC: 대용량 힙에서 낮은 지연시간
    jvmArgs '-Xms2g', '-Xmx8g',
            '-XX:+UseG1GC',
            '-XX:MaxGCPauseMillis=200'

    // DCM4CHE ImageIO OpenCV가 내부 Java 클래스에 리플렉션 접근 필요
    // Java 9+ 모듈 시스템(JPMS)이 기본적으로 차단하므로 명시적으로 열어줘야 함
    jvmArgs '--add-opens', 'java.desktop/javax.imageio.stream=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED'
}

// test 태스크 설정
tasks.named('test') {
    dependsOn 'copyOpenCVNatives'
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath

    // DCM4CHE ImageIO OpenCV가 내부 Java 클래스에 리플렉션 접근 필요
    jvmArgs '--add-opens', 'java.desktop/javax.imageio.stream=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED'
}
