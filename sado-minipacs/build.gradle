plugins {
    id 'java'
    alias(libs.plugins.spring.boot) apply false  // 실행 가능한 앱이 아님
    alias(libs.plugins.spring.dependency.management)
}

group = "com.hanumoka.sado"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Java 컴파일러에 -parameters 플래그 추가
// → Spring이 @PathVariable, @RequestParam 등의 파라미터 이름을 런타임에 인식 가능
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}

dependencies {
    // sado-common 의존성 (BaseEntity, TenantAwareEntity 사용)
    implementation project(':sado-common')

    // Spring Boot & JPA
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.data.jpa

    // Database
    runtimeOnly libs.mysql.connector.java

    // Lombok
    implementation libs.lombok
    annotationProcessor libs.lombok

    // Test
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.h2.database  // H2 in-memory database for testing
    testRuntimeOnly libs.junit.platform.launcher  // JUnit Platform launcher
}

tasks.named('test') {
    useJUnitPlatform()
}
