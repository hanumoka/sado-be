# Gradle Version Catalog
# 모든 모듈에서 사용하는 의존성 버전을 중앙 관리합니다.

[versions]
# Java
java = "21"

# MySQL
mysql-connector = "8.0.33"

# AWS SDK for Java v2
aws-sdk = "2.20.26"

# H2 Database (for testing)
h2 = "2.2.224"


# Spring Boot
spring-boot = "4.0.1"
spring-dependency-management = "1.1.7"

# Lombok
lombok = "1.18.30"

# SpringDoc OpenAPI
springdoc-openapi = "2.7.0"

# Test
junit = "5.10.1"

[libraries]
# Spring Boot Starters
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }

# MySQL
mysql-connector-java = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }

# AWS SDK S3
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }


# H2 Database
h2-database = { module = "com.h2database:h2", version.ref = "h2" }

# Spring Boot Data JPA
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }


# Spring Boot Test
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }


# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# SpringDoc OpenAPI
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }

# Test
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# Spring Boot
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[bundles]
# 자주 함께 사용하는 의존성 묶음
spring-boot-common = ["spring-boot-starter", "lombok"]
spring-boot-web = ["spring-boot-starter-web", "spring-boot-devtools"]
test = ["spring-boot-starter-test", "junit-platform-launcher"]
