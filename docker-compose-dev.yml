# =============================================================================
# Volumes
# =============================================================================
volumes:
  sado-mysql-data-dev:
    name: sado-mysql-data-dev
  sado-seaweedfs-master-dev:
    name: sado-seaweedfs-master-dev
  sado-seaweedfs-data-dev:
    name: sado-seaweedfs-data-dev
  sado-seaweedfs-filer-dev:
    name: sado-seaweedfs-filer-dev
  sado-nginx-cache-dev:
    name: sado-nginx-cache-dev

# =============================================================================
# Networks
# =============================================================================
networks:
  sado-network-dev:
    name: sado-network-dev
    driver: bridge
